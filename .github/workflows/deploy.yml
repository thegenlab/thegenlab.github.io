name: Deploy GenLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Read Pages configuration
        uses: actions/configure-pages@v6.0.0
      - name: Install locked dependencies
        run: npm ci
      - name: Check Astro and content types
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Verify generated pages
        run: node scripts/verify-build.mjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish site
        id: publish
        uses: actions/deploy-pages@v5.0.1
